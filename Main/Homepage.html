<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Übungsbibliothek | Capsule Gym</title>
  <link rel="stylesheet" href="Style.Css">
</head>
<body>
  <header class="app-topbar">
    <a class="app-brand" href="Homepage.html">Capsule Gym <small>MPA</small></a>
    <div class="account-block">
      <span id="current-user"></span>
      <a class="logout-button" href="LogIn.html">Abmelden</a>
    </div>
  </header>
  <main class="app-main">
    <section class="page-heading">
      <p class="eyebrow">MPA-Touchpoint</p>
      <h1>Übungsbibliothek</h1>
      <p>Suche eine Übung. Die Detailansicht wird als eigene HTML-Seite geladen.</p>
    </section>
    <form class="exercise-toolbar" id="exercise-search-form">
      <label class="exercise-search">Übung suchen
        <input id="exercise-search" type="search" placeholder="z. B. bench press" autocomplete="off">
      </label>
      <button class="gold-button" type="submit">Suchen</button>
    </form>
    <p class="form-message" id="exercise-message" role="status" aria-live="polite"></p>
    <div class="exercise-grid" id="exercise-grid"></div>
  </main>
  <script src="config.js"></script>
  <script src="MpaExercises.js"></script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#111111">
	<title>Log In | Capsule Gym</title>
	<link rel="stylesheet" href="Style.Css">
</head>
<body>
	<header class="topbar">
		<a class="brand" href="Homepage.html">Capsule Gym</a>
	</header>

	<main>
		<section class="login-panel" aria-labelledby="login-title">
			<p class="eyebrow">Willkommen zurück</p>
			<h1 id="login-title">Log In</h1>
			<p class="intro">Melde dich mit deinem Konto an, um fortzufahren.</p>

			<form id="login-form">
				<div class="field">
					<label for="login-name">E-Mail</label>
					<input id="login-name" name="login" type="text" autocomplete="username" placeholder="name@beispiel.de" required>
				</div>
				<div class="field">
					<label for="login-password">Passwort</label>
					<input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Dein Passwort" required>
				</div>
				<button class="submit-button" type="submit">Einloggen</button>
				<p class="form-message" id="login-message" role="status" aria-live="polite"></p>
			</form>

			<p class="register-prompt">Noch kein Konto? <a href="Register.html">Jetzt registrieren</a></p>
		</section>
	</main>

	<script src="config.js"></script>
	<script src="Funktions.js"></script>
</body>
</html>

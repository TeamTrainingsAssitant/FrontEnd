<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Registrieren | Capsule Gym</title>
  <link rel="stylesheet" href="Style.Css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="LogIn.html">Capsule Gym</a>
  </header>

  <main>
    <section class="register-panel" aria-labelledby="register-title">
      <p class="eyebrow">Neues Benutzerkonto</p>
      <h1 id="register-title">Registrieren</h1>
      <p class="intro">Erstelle dein Konto mit den folgenden Angaben.</p>

      <form id="register-form">
        <div class="field">
          <label for="register-name">Username</label>
          <input id="register-name" name="username" type="text" autocomplete="username" placeholder="Dein Username" required minlength="3">
        </div>
        <div class="field">
          <label for="register-email">E-Mail</label>
          <input id="register-email" name="email" type="email" autocomplete="email" placeholder="name@beispiel.de" required>
        </div>
        <div class="field">
          <label for="register-password">Passwort</label>
          <input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="Mindestens 8 Zeichen" required minlength="8">
        </div>
        <div class="field">
          <label for="register-password-confirm">Passwort wiederholen</label>
          <input id="register-password-confirm" name="password-confirm" type="password" autocomplete="new-password" placeholder="Passwort erneut eingeben" required minlength="8">
        </div>
        <button type="submit">Konto erstellen</button>
        <p class="form-message" id="register-message" role="status" aria-live="polite"></p>
      </form>

      <p class="login-prompt">Schon registriert? <a href="LogIn.html">Zum Log In</a></p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="Funktions.js"></script>
</body>
</html>

<header class="topbar">
  <strong class="brand">Capsule Gym <small>Training</small></strong>
  <div class="account">
    <button class="link-button" type="button" (click)="profileOpen = !profileOpen" [attr.aria-expanded]="profileOpen">{{ user?.username }}</button>
    <button class="link-button" type="button" (click)="logout()">Abmelden</button>
  </div>
</header>

<main class="app-main">
  <p class="error" *ngIf="error">{{ error }}</p>
  <p class="message" *ngIf="message">{{ message }}</p>

  <section class="feature" *ngIf="profileOpen">
    <h2>{{ user?.username }}</h2><p class="muted">{{ user?.email }}</p>
    <button type="button" (click)="exportUserData()">Meine Daten exportieren</button>
    <label>Konto löschen: Passwort bestätigen <input type="password" [(ngModel)]="deletePassword"></label>
    <button type="button" class="danger" (click)="deleteAccount()">Konto dauerhaft löschen</button>
  </section>

  <div class="planner">
    <aside class="rail" aria-label="Übungen">
      <h2>Übungen</h2>
      <p class="muted">Hier kommt der Übungskatalog hin (Schritt 3).</p>
    </aside>

    <section>
      <p class="eyebrow">DEIN TRAINING</p>
      <h1>Trainingspläne</h1>
      <div class="board">
        <section class="plan-column" *ngFor="let plan of plans">
          <header><h2>{{ plan.name }}</h2></header>
          <p class="muted">Übungen folgen in Schritt 2.</p>
          <footer><small>{{ plan.exerciseCount }} Übungen</small></footer>
        </section>
        <div class="plan-column add-plan">+ Trainingsplan (Schritt 2)</div>
      </div>
    </section>
  </div>
</main>
